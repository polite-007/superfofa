name: Release Linux (supplement)

# 手动触发：给「已发布」的版本补充 Linux 制品。
# 不删 tag、不重跑完整 Release、不覆盖已有的 mac/win 制品，
# 只构建 linux-amd64/arm64 并追加到公开仓库对应 tag 的 Release。
#
# 在 Actions 页 → "Release Linux (supplement)" → Run workflow → 输入版本号（如 1.3）
# 工作流会 checkout 私有仓库的 v<版本号> tag 源码进行构建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，如 1.3）。将 checkout v<版本号> 源码并上传到公开仓库 <版本号> Release"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            platform: linux/amd64
            archive: superfofa-linux-amd64.tar.gz
          - arch: arm64
            runner: ubuntu-22.04-arm
            platform: linux/arm64
            archive: superfofa-linux-arm64.tar.gz

    steps:
      - name: Checkout (tag v${{ inputs.version }})
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -ldflags "-X 'myproject/internal/app.Version=${{ inputs.version }}'"

      - name: Build updater
        run: GOOS=linux GOARCH=${{ matrix.arch }} go build -o build/bin/superfofa-updater ./cmd/updater

      - name: Archive
        working-directory: build/bin
        run: tar -czf "../../${{ matrix.archive }}" superfofa superfofa-updater

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Attach Linux assets to public release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download existing macOS/Windows assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release download "${{ inputs.version }}" --repo "${{ secrets.PUBLIC_REPO }}" --pattern "superfofa-macos-*.zip" --clobber || true
          gh release download "${{ inputs.version }}" --repo "${{ secrets.PUBLIC_REPO }}" --pattern "superfofa-windows-*.zip" --clobber || true

      - name: Compute checksums
        run: sha256sum superfofa-* > checksums.txt

      - name: Attach assets to existing release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ secrets.PUBLIC_REPO }}
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: |
            superfofa-linux-amd64.tar.gz
            superfofa-linux-arm64.tar.gz
            checksums.txt
